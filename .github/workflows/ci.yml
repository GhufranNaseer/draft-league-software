name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, exif, gd, intl, mbstring, opcache, pcntl, pdo_mysql, pdo_sqlite, sqlite3, zip, redis
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies & Build Assets
        env:
          VITE_REVERB_APP_KEY: a72b9a889ce750021073505e9d882468
          VITE_REVERB_HOST: 184.168.125.171
          VITE_REVERB_PORT: 8443
          VITE_REVERB_SCHEME: https
        run: |
          npm ci
          npm run build

      - name: Run Pint Code Style Check
        run: vendor/bin/pint --test

      - name: Setup Application Key & Run Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact

      - name: Verify Build Artifacts
        run: |
          test -f public/build/manifest.json || { echo "Manifest missing!"; exit 1; }
          test -d public/build/assets || { echo "Assets dir missing!"; exit 1; }
          echo "Build assets verified successfully."
