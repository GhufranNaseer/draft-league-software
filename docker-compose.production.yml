name: drafting_v2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        VITE_APP_NAME: "${APP_NAME:-Drafting}"
        VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}"
        VITE_REVERB_HOST: "${APP_DOMAIN:-drafting.itinnovativeexperts.com}"
        VITE_REVERB_PORT: "${VITE_REVERB_PORT:-443}"
        VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME:-https}"
    image: drafting_v2-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      RUN_MIGRATIONS: "true"
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env.production}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:?Set REVERB_APP_SECRET in .env.production}"
    volumes:
      - ./app:/var/www/html/app:ro
      - ./bootstrap/app.php:/var/www/html/bootstrap/app.php:ro
      - ./bootstrap/providers.php:/var/www/html/bootstrap/providers.php:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./public/build:/var/www/html/public/build:ro
      - ./resources:/var/www/html/resources:ro
      - ./routes:/var/www/html/routes:ro
      - app-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  queue:
    image: drafting_v2-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--queue=${BROADCAST_QUEUE:-broadcasts},default", "--sleep=1", "--tries=3", "--timeout=60", "--no-interaction"]
    stop_grace_period: 90s
    volumes:
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./database:/var/www/html/database:ro
      - ./resources:/var/www/html/resources:ro
      - ./routes:/var/www/html/routes:ro
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    networks:
      - app_net

  reverb:
    image: drafting_v2-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./app:/var/www/html/app:ro
      - ./config:/var/www/html/config:ro
      - ./routes:/var/www/html/routes:ro
      - app-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_APP_NAME: "${APP_NAME:-Drafting}"
        VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:?Set REVERB_APP_KEY in .env.production}"
        VITE_REVERB_HOST: "${APP_DOMAIN:-drafting.itinnovativeexperts.com}"
        VITE_REVERB_PORT: "${VITE_REVERB_PORT:-443}"
        VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME:-https}"
    image: drafting_v2-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8007:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public/build:/var/www/html/public/build:ro
      - app-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    networks:
      - app_net

  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-drafting}"
      MARIADB_USER: "${DB_USERNAME:-drafting}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env.production}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.production}"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

volumes:
  app-storage:
  database-data:

networks:
  app_net:
    driver: bridge
